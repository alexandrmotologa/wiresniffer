[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wiresniffer"
version = "0.1.0"
description = "Developer-first API traffic and security sniffer at the socket level"
readme = "README.md"
authors = [
    { name = "Alexandr Motologa", email = "68332976+alexandrmotologa@users.noreply.github.com" }
]
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "scapy>=2.5.0",
    "textual>=0.70.0",
    "rich>=13.7.0",
    "typer>=0.12.0",
    "pydantic>=2.7.0",
    "cryptography>=42.0.0",
    "h2>=4.1.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
]

[project.scripts]
wiresniffer = "wiresniffer.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/wiresniffer"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers"
asyncio_mode = "auto"
